desiredState:
  namespace: pipeline-yaml
  name: medallion

variables:
  batch_size: "1000"
  source_uri: s3://data/customers.csv
  debug_mode: "false"

iterations:
  regional:
    as: region
    in: ["us-east", "eu-west"]

nodes:
  csv-source:
    type: data-source
    spec:
      name: customers
      format: CSV
      uri: ${var.source_uri}

  customer-schema:
    type: schema
    spec:
      name: customer-schema
      fields: [id, name, email]
      version: 1

  csv-ingest:
    type: ingestion
    dependsOn: [csv-source]
    spec:
      sourceRef: csv-source
      batchSize: ${var.batch_size}
      format: CSV

  dedup-cleanser:
    type: cleanser
    dependsOn: [csv-ingest, customer-schema]
    spec:
      rules: [dedup, nullcheck]
      deduplication: true
      nullHandling: DROP

  geo-enricher:
    type: enricher
    dependsOn: [dedup-cleanser]
    spec:
      lookupSource: geo-lookup
      joinKeys: [address]
      enrichFields: [lat, lon]

  quality-validator:
    type: validator
    dependsOn: [geo-enricher, customer-schema]
    spec:
      schemaRef: customer-schema
      qualityThreshold: 0.95
      anomalyDetection: true

  aggregate-tx:
    type: transformer
    dependsOn: [quality-validator]
    humanGating: PROVISION_ONLY
    spec:
      aggregations: [sum, avg]
      reshapeRules: []
      outputFormat: parquet
      approvalRequired: true

  warehouse-sink:
    type: sink
    dependsOn: [aggregate-tx]
    humanGating: PROVISION_ONLY
    spec:
      destination: s3://warehouse/gold/
      format: parquet
      partitionKeys: [date]
      approvalRequired: true

  regional-source:
    type: data-source
    forEach: regional
    spec:
      name: "regional-${each.region}"
      format: CSV
      uri: "s3://data/${each.region}/regional.csv"

  regional-ingest:
    type: ingestion
    forEach: regional
    dependsOn: [regional-source, customer-schema]
    spec:
      sourceRef: "regional-source-${each.region}"
      batchSize: ${var.batch_size}
      format: CSV

  debug-validator:
    type: validator
    when: "${var.debug_mode}"
    dependsOn:
      - { node: csv-ingest, optional: true }
    spec:
      schemaRef: customer-schema
      qualityThreshold: 0.0
      anomalyDetection: false

imports:
  - module: monitoring
    as: pipe-monitor
    parameters:
      watched_node_id: warehouse-sink
      alert_email: "pipeline-ops@example.com"

invariants:
  every-sink-has-upstream:
    match:
      sink: { type: sink }
    directDep:
      upstream: { type: transformer, of: sink, direction: DEPENDENCIES }
    message: "Sink ${match.sink.id} has no upstream transformer"

faultPolicy:
  - faultTypes: [PROVISION_FAILED]
    nodeTypes: [transformer, sink]
    ignoreTypes: [ai-review, human-review]
    namespace: pipeline-escalation
    tiers:
      - threshold: 3
        reviewNode:
          type: ai-review
          spec:
            targetNodeId: "${fault.nodeId}"
            errorDetail: "${fault.detail}"
      - threshold: 5
        reviewNode:
          type: human-review
          humanGating: ALL
          spec:
            targetNodeId: "${fault.nodeId}"
            errorDetail: "${fault.detail}"
            escalationReason: "Automated remediation failed after 5 attempts"

rules:
  ensure-monitoring:
    match:
      sink: { type: sink }
    notExists:
      guard: { type: monitor, of: sink, direction: DEPENDENTS }
    actions:
      - addNode:
          id: "monitor-${match.sink.id}"
          type: monitor
          spec:
            target: "${match.sink.id}"
      - addDependency:
          from: "monitor-${match.sink.id}"
          to: "${match.sink.id}"
