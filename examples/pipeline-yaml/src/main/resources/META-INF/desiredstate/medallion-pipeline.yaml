desiredState:
  namespace: pipeline-yaml
  name: medallion

variables:
  batch_size: "1000"
  source_uri: s3://data/customers.csv

nodes:
  csv-source:
    type: data-source
    spec:
      name: customers
      format: CSV
      uri: ${source_uri}

  customer-schema:
    type: schema
    spec:
      name: customer-schema
      fields: [id, name, email]
      version: 1

  csv-ingest:
    type: ingestion
    dependsOn: [csv-source]
    spec:
      sourceRef: csv-source
      batchSize: ${batch_size}
      format: CSV

  dedup-cleanser:
    type: cleanser
    dependsOn: [csv-ingest, customer-schema]
    spec:
      rules: [dedup, nullcheck]
      deduplication: true
      nullHandling: DROP

  geo-enricher:
    type: enricher
    dependsOn: [dedup-cleanser]
    spec:
      lookupSource: geo-lookup
      joinKeys: [address]
      enrichFields: [lat, lon]

  quality-validator:
    type: validator
    dependsOn: [geo-enricher, customer-schema]
    spec:
      schemaRef: customer-schema
      qualityThreshold: 0.95
      anomalyDetection: true

  aggregate-tx:
    type: transformer
    dependsOn: [quality-validator]
    humanGating: PROVISION_ONLY
    spec:
      aggregations: [sum, avg]
      reshapeRules: []
      outputFormat: parquet
      approvalRequired: true

  warehouse-sink:
    type: sink
    dependsOn: [aggregate-tx]
    humanGating: PROVISION_ONLY
    spec:
      destination: s3://warehouse/gold/
      format: parquet
      partitionKeys: [date]
      approvalRequired: true
