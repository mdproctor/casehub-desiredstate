module:
  name: order-notifications
  parameters:
    watched_step:
      type: string
      required: true
      minLength: 1
      pattern: "^[a-z][a-z0-9-]*$"
      constraintDescription: "Node ID of the order step to watch"
    email_template:
      type: string
      default: "standard"
      pattern: "^[a-z][a-z0-9-]*$"
      constraintDescription: "Template name: lowercase alphanumeric with hyphens"

nodes:
  email:
    type: notification
    dependsOn: ["${var.watched_step}"]
    spec:
      channel: email
      target: "${var.watched_step}"

  sms:
    type: notification
    dependsOn: ["${var.watched_step}"]
    spec:
      channel: sms
      target: "${var.watched_step}"

invariants:
  notification-has-target:
    match:
      notif: { type: notification }
    directDep:
      target: { type: "*", of: notif, direction: DEPENDENCIES }
