<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 300" font-family="'Inter','Segoe UI',system-ui,sans-serif" font-size="13">
  <defs>
    <marker id="a" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#64748b"/>
    </marker>
    <marker id="a2" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#d946ef"/>
    </marker>
  </defs>

  <rect width="780" height="300" fill="#fafaf9" rx="8"/>
  <text x="390" y="28" text-anchor="middle" font-size="15" font-weight="600" fill="#1e293b">Emergence: From Observed Affinity to Declared Structure</text>

  <!-- Phase 1: Detection -->
  <rect x="20" y="55" width="170" height="110" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="105" y="76" text-anchor="middle" font-weight="600" fill="#334155" font-size="12">Detection</text>
  <text x="105" y="96" text-anchor="middle" fill="#64748b" font-size="10">Engine observes agents</text>
  <text x="105" y="112" text-anchor="middle" fill="#64748b" font-size="10">working together across</text>
  <text x="105" y="128" text-anchor="middle" fill="#64748b" font-size="10">multiple cases</text>
  <circle cx="60" cy="148" r="6" fill="#3b82f6"/>
  <circle cx="85" cy="148" r="6" fill="#22c55e"/>
  <circle cx="110" cy="148" r="6" fill="#f59e0b"/>
  <text x="135" y="152" fill="#94a3b8" font-size="10">agents</text>

  <!-- Arrow 1 -->
  <line x1="195" y1="110" x2="230" y2="110" stroke="#64748b" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- Phase 2: Stabilisation -->
  <rect x="235" y="55" width="150" height="110" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="310" y="76" text-anchor="middle" font-weight="600" fill="#92400e" font-size="12">Stabilisation</text>
  <text x="310" y="96" text-anchor="middle" fill="#78716c" font-size="10">TeamDetector confirms</text>
  <text x="310" y="112" text-anchor="middle" fill="#78716c" font-size="10">pattern is stable</text>
  <text x="310" y="134" text-anchor="middle" fill="#92400e" font-size="11" font-weight="500">COACTIVE</text>
  <text x="310" y="150" text-anchor="middle" fill="#78716c" font-size="10">dominant relation</text>

  <!-- Arrow 2 -->
  <line x1="390" y1="110" x2="425" y2="110" stroke="#d946ef" stroke-width="1.5" marker-end="url(#a2)"/>
  <text x="408" y="100" fill="#d946ef" font-size="9" font-weight="500">event</text>

  <!-- Phase 3: Promotion -->
  <rect x="430" y="55" width="150" height="110" rx="6" fill="#fdf4ff" stroke="#d946ef" stroke-width="1.5"/>
  <text x="505" y="76" text-anchor="middle" font-weight="600" fill="#86198f" font-size="12">Promotion</text>
  <text x="505" y="96" text-anchor="middle" fill="#a21caf" font-size="10">EmergencePromotion</text>
  <text x="505" y="112" text-anchor="middle" fill="#a21caf" font-size="10">Listener creates</text>
  <text x="505" y="128" text-anchor="middle" fill="#a21caf" font-size="10">OrganizationalUnit</text>
  <text x="505" y="150" text-anchor="middle" fill="#86198f" font-size="11" font-weight="500">topology: swarm</text>

  <!-- Arrow 3 -->
  <line x1="585" y1="110" x2="620" y2="110" stroke="#64748b" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- Phase 4: Reconciliation -->
  <rect x="625" y="55" width="140" height="110" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="695" y="76" text-anchor="middle" font-weight="600" fill="#1e40af" font-size="12">Reconciliation</text>
  <text x="695" y="96" text-anchor="middle" fill="#3b82f6" font-size="10">Standard loop runs:</text>
  <text x="695" y="112" text-anchor="middle" fill="#3b82f6" font-size="10">provision, channel</text>
  <text x="695" y="128" text-anchor="middle" fill="#3b82f6" font-size="10">creation, member</text>
  <text x="695" y="144" text-anchor="middle" fill="#3b82f6" font-size="10">seeding, activation</text>

  <!-- Bottom: Topology mapping table -->
  <rect x="120" y="195" width="540" height="90" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <text x="390" y="215" text-anchor="middle" font-weight="600" fill="#334155" font-size="12">Topology Derivation from Dominant Relation</text>

  <text x="180" y="240" text-anchor="middle" fill="#dc2626" font-size="11" font-weight="500">COMPLEMENTARY</text>
  <text x="180" y="258" text-anchor="middle" fill="#64748b" font-size="10">hive</text>
  <text x="180" y="273" text-anchor="middle" fill="#94a3b8" font-size="9">role-assigned</text>

  <text x="330" y="240" text-anchor="middle" fill="#f59e0b" font-size="11" font-weight="500">SHARED_INTEREST</text>
  <text x="330" y="258" text-anchor="middle" fill="#64748b" font-size="10">mesh</text>
  <text x="330" y="273" text-anchor="middle" fill="#94a3b8" font-size="9">consensus</text>

  <text x="480" y="240" text-anchor="middle" fill="#22c55e" font-size="11" font-weight="500">COACTIVE</text>
  <text x="480" y="258" text-anchor="middle" fill="#64748b" font-size="10">swarm</text>
  <text x="480" y="273" text-anchor="middle" fill="#94a3b8" font-size="9">stigmergy</text>

  <line x1="255" y1="230" x2="255" y2="280" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="405" y1="230" x2="405" y2="280" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="555" y1="230" x2="555" y2="280" stroke="#e2e8f0" stroke-width="1"/>

  <text x="600" y="240" text-anchor="middle" fill="#3b82f6" font-size="11" font-weight="500">SHARED_SIGNAL</text>
  <text x="600" y="258" text-anchor="middle" fill="#64748b" font-size="10">swarm</text>
  <text x="600" y="273" text-anchor="middle" fill="#94a3b8" font-size="9">stigmergy</text>
</svg>
