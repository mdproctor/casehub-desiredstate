<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 340" font-family="'SF Mono', 'Fira Code', 'Consolas', monospace">
  <defs>
    <linearGradient id="tf-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#eff6ff"/>
      <stop offset="100%" style="stop-color:#dbeafe"/>
    </linearGradient>
    <linearGradient id="an-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f0fdf4"/>
      <stop offset="100%" style="stop-color:#dcfce7"/>
    </linearGradient>
  </defs>

  <!-- Title -->
  <text x="370" y="24" text-anchor="middle" font-size="14" font-weight="600" fill="#1e293b"
        font-family="system-ui, -apple-system, sans-serif">Manifest YAML — Per-Type Suspend Configuration</text>

  <!-- Terraform panel -->
  <rect x="20" y="42" width="340" height="285" rx="8" fill="url(#tf-grad)" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="40" y="65" font-size="12" font-weight="700" fill="#1d4ed8"
        font-family="system-ui, -apple-system, sans-serif">Terraform</text>

  <text x="40" y="90" font-size="11" fill="#64748b">types:</text>
  <text x="52" y="108" font-size="11" fill="#64748b">- id: <tspan fill="#0369a1" font-weight="600">tf:aws:aws_instance</tspan></text>
  <text x="60" y="126" font-size="11" fill="#94a3b8">terraform:</text>

  <rect x="68" y="134" width="270" height="64" rx="4" fill="#ffffff" stroke="#60a5fa" stroke-width="1.5" opacity="0.9"/>
  <text x="82" y="153" font-size="11" fill="#0f172a">suspend_attribute: <tspan fill="#7c3aed" font-weight="600">instance_state</tspan></text>
  <text x="82" y="171" font-size="11" fill="#0f172a">suspend_value:     <tspan fill="#dc2626" font-weight="600">stopped</tspan></text>
  <text x="82" y="189" font-size="11" fill="#0f172a">resume_value:      <tspan fill="#16a34a" font-weight="600">running</tspan></text>

  <text x="52" y="220" font-size="11" fill="#64748b">- id: <tspan fill="#0369a1" font-weight="600">tf:aws:aws_rds_cluster</tspan></text>
  <text x="60" y="238" font-size="11" fill="#94a3b8">terraform:</text>

  <rect x="68" y="246" width="270" height="64" rx="4" fill="#ffffff" stroke="#60a5fa" stroke-width="1" opacity="0.7"/>
  <text x="82" y="265" font-size="11" fill="#0f172a">suspend_attribute: <tspan fill="#7c3aed" font-weight="600">engine_lifecycle_support</tspan></text>
  <text x="82" y="283" font-size="11" fill="#0f172a">suspend_value:     <tspan fill="#dc2626" font-weight="600">stop</tspan></text>
  <text x="82" y="301" font-size="11" fill="#0f172a">resume_value:      <tspan fill="#16a34a" font-weight="600">start</tspan></text>

  <!-- Ansible panel -->
  <rect x="380" y="42" width="340" height="285" rx="8" fill="url(#an-grad)" stroke="#86efac" stroke-width="1.5"/>
  <text x="400" y="65" font-size="12" font-weight="700" fill="#15803d"
        font-family="system-ui, -apple-system, sans-serif">Ansible</text>

  <text x="400" y="90" font-size="11" fill="#64748b">types:</text>
  <text x="412" y="108" font-size="11" fill="#64748b">- id: <tspan fill="#15803d" font-weight="600">ansible:aws.ec2_instance</tspan></text>
  <text x="420" y="126" font-size="11" fill="#94a3b8">ansible:</text>

  <rect x="428" y="134" width="270" height="82" rx="4" fill="#ffffff" stroke="#4ade80" stroke-width="1.5" opacity="0.9"/>
  <text x="442" y="153" font-size="11" fill="#0f172a">suspend_module:      <tspan fill="#7c3aed" font-weight="600">ec2_instance</tspan></text>
  <text x="442" y="171" font-size="11" fill="#0f172a">suspend_state_param: <tspan fill="#64748b">state</tspan></text>
  <text x="442" y="189" font-size="11" fill="#0f172a">suspend_state_value: <tspan fill="#dc2626" font-weight="600">stopped</tspan></text>
  <text x="442" y="207" font-size="11" fill="#0f172a">resume_state_value:  <tspan fill="#16a34a" font-weight="600">running</tspan></text>

  <text x="412" y="238" font-size="11" fill="#64748b">- id: <tspan fill="#15803d" font-weight="600">ansible:aws.s3_bucket</tspan></text>
  <text x="420" y="256" font-size="11" fill="#94a3b8">ansible:</text>

  <rect x="428" y="264" width="270" height="40" rx="4" fill="#ffffff" stroke="#4ade80" stroke-width="1" opacity="0.7"/>
  <text x="442" y="283" font-size="11" fill="#94a3b8" font-style="italic">no suspend config</text>
  <text x="442" y="297" font-size="10" fill="#94a3b8">→ SuspendResult.Failed</text>
</svg>
