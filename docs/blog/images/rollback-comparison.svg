<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" font-family="system-ui, -apple-system, sans-serif" font-size="12">
  <defs>
    <marker id="arr" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto">
      <path d="M0,0 L7,2.5 L0,5" fill="#475569"/>
    </marker>
  </defs>
  <rect width="760" height="320" fill="#fafaf9" rx="8"/>
  <text x="380" y="24" text-anchor="middle" font-size="14" font-weight="600" fill="#1e293b">Rollback Models Compared</text>

  <!-- Terraform column -->
  <rect x="20" y="42" width="230" height="260" rx="6" fill="#fff7ed" stroke="#ea580c" stroke-width="1"/>
  <text x="135" y="62" text-anchor="middle" font-weight="600" font-size="13" fill="#9a3412">Terraform</text>
  <text x="135" y="78" text-anchor="middle" font-size="10" fill="#9a3412">Per-resource state manipulation</text>

  <rect x="35" y="92" width="200" height="26" rx="4" fill="#ffedd5"/>
  <text x="135" y="109" text-anchor="middle" font-size="11" fill="#7c2d12">terraform state rm aws_vpc.main</text>
  <rect x="35" y="124" width="200" height="26" rx="4" fill="#ffedd5"/>
  <text x="135" y="141" text-anchor="middle" font-size="11" fill="#7c2d12">terraform import aws_vpc.main vpc-123</text>
  <rect x="35" y="156" width="200" height="26" rx="4" fill="#ffedd5"/>
  <text x="135" y="173" text-anchor="middle" font-size="11" fill="#7c2d12">terraform apply (per resource)</text>

  <text x="40" y="202" font-size="11" fill="#9a3412">+ Fine-grained control</text>
  <text x="40" y="218" font-size="11" fill="#9a3412">+ Partial rollback possible</text>
  <text x="40" y="240" font-size="11" fill="#78350f" font-weight="500">− Manual per-resource surgery</text>
  <text x="40" y="256" font-size="11" fill="#78350f" font-weight="500">− No version history</text>
  <text x="40" y="272" font-size="11" fill="#78350f" font-weight="500">− Topology breaks silently</text>
  <text x="40" y="288" font-size="11" fill="#78350f" font-weight="500">− No approval gate on undo</text>

  <!-- K8s column -->
  <rect x="265" y="42" width="230" height="260" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1"/>
  <text x="380" y="62" text-anchor="middle" font-weight="600" font-size="13" fill="#1e40af">Kubernetes</text>
  <text x="380" y="78" text-anchor="middle" font-size="10" fill="#1e40af">Deployment-level rollback</text>

  <rect x="280" y="92" width="200" height="26" rx="4" fill="#dbeafe"/>
  <text x="380" y="109" text-anchor="middle" font-size="11" fill="#1e3a8a">kubectl rollout undo deploy/app</text>
  <rect x="280" y="124" width="200" height="26" rx="4" fill="#dbeafe"/>
  <text x="380" y="141" text-anchor="middle" font-size="11" fill="#1e3a8a">--to-revision=N</text>
  <rect x="280" y="156" width="200" height="26" rx="4" fill="#dbeafe"/>
  <text x="380" y="173" text-anchor="middle" font-size="11" fill="#1e3a8a">controller reconciles</text>

  <text x="285" y="202" font-size="11" fill="#1e40af">+ Built-in revision history</text>
  <text x="285" y="218" font-size="11" fill="#1e40af">+ One command to revert</text>
  <text x="285" y="240" font-size="11" fill="#1e3a8a" font-weight="500">− Per-Deployment only</text>
  <text x="285" y="256" font-size="11" fill="#1e3a8a" font-weight="500">− No cross-resource rollback</text>
  <text x="285" y="272" font-size="11" fill="#1e3a8a" font-weight="500">− No approval gate</text>
  <text x="285" y="288" font-size="11" fill="#1e3a8a" font-weight="500">− No audit trail (just revisions)</text>

  <!-- CaseHub column -->
  <rect x="510" y="42" width="230" height="260" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="625" y="62" text-anchor="middle" font-weight="600" font-size="13" fill="#166534">CaseHub Desired State</text>
  <text x="625" y="78" text-anchor="middle" font-size="10" fill="#166534">Whole-graph versioned rollback</text>

  <rect x="525" y="92" width="200" height="26" rx="4" fill="#dcfce7"/>
  <text x="625" y="109" text-anchor="middle" font-size="11" fill="#14532d">loop.rollback(tenant, v3, who)</text>
  <rect x="525" y="124" width="200" height="26" rx="4" fill="#dcfce7"/>
  <text x="625" y="141" text-anchor="middle" font-size="11" fill="#14532d">PlanApprovalGate evaluates</text>
  <rect x="525" y="156" width="200" height="26" rx="4" fill="#dcfce7"/>
  <text x="625" y="173" text-anchor="middle" font-size="11" fill="#14532d">reconciliation loop executes</text>

  <text x="530" y="202" font-size="11" fill="#166534">+ Whole-graph atomic revert</text>
  <text x="530" y="218" font-size="11" fill="#166534">+ Versioned history (N deep)</text>
  <text x="530" y="240" font-size="11" fill="#166534">+ Policy-gated approval</text>
  <text x="530" y="256" font-size="11" fill="#166534">+ Audit CloudEvent trail</text>
  <text x="530" y="272" font-size="11" fill="#166534">+ Rollback-of-rollback recovery</text>
  <text x="530" y="288" font-size="11" fill="#14532d" font-weight="500">− No per-node rollback (yet)</text>
</svg>
