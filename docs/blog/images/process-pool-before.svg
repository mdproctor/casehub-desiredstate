<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arrow-b" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#666" stroke-width="1.2"/>
    </marker>
  </defs>

  <text x="360" y="28" text-anchor="middle" font-size="15" font-weight="600" fill="#1a1a2e">Before: One Process Per Tenant</text>

  <!-- Tenants -->
  <rect x="30" y="60" width="120" height="40" rx="6" fill="#e8f0fe" stroke="#4285f4" stroke-width="1.5"/>
  <text x="90" y="84" text-anchor="middle" font-size="12" fill="#1a1a2e">Tenant A</text>

  <rect x="30" y="120" width="120" height="40" rx="6" fill="#e8f0fe" stroke="#4285f4" stroke-width="1.5"/>
  <text x="90" y="144" text-anchor="middle" font-size="12" fill="#1a1a2e">Tenant B</text>

  <rect x="30" y="180" width="120" height="40" rx="6" fill="#e8f0fe" stroke="#4285f4" stroke-width="1.5"/>
  <text x="90" y="204" text-anchor="middle" font-size="12" fill="#1a1a2e">Tenant C</text>

  <rect x="30" y="240" width="120" height="40" rx="6" fill="#e8f0fe" stroke="#4285f4" stroke-width="1.5"/>
  <text x="90" y="264" text-anchor="middle" font-size="12" fill="#1a1a2e">Tenant D</text>

  <!-- Registry -->
  <rect x="230" y="110" width="160" height="110" rx="8" fill="#fff3e0" stroke="#ff9800" stroke-width="1.5"/>
  <text x="310" y="134" text-anchor="middle" font-size="11" font-weight="600" fill="#e65100">TenantProviderRegistry</text>
  <text x="310" y="155" text-anchor="middle" font-size="10" fill="#666">tenancyId → Process</text>
  <text x="310" y="175" text-anchor="middle" font-size="10" fill="#666">A → proc₁</text>
  <text x="310" y="190" text-anchor="middle" font-size="10" fill="#666">B → proc₂</text>
  <text x="310" y="205" text-anchor="middle" font-size="10" fill="#666">C → proc₃  D → proc₄</text>

  <!-- Arrows tenant → registry -->
  <line x1="150" y1="80" x2="228" y2="145" stroke="#666" stroke-width="1.2" marker-end="url(#arrow-b)"/>
  <line x1="150" y1="140" x2="228" y2="160" stroke="#666" stroke-width="1.2" marker-end="url(#arrow-b)"/>
  <line x1="150" y1="200" x2="228" y2="175" stroke="#666" stroke-width="1.2" marker-end="url(#arrow-b)"/>
  <line x1="150" y1="260" x2="228" y2="195" stroke="#666" stroke-width="1.2" marker-end="url(#arrow-b)"/>

  <!-- OS Processes -->
  <rect x="470" y="50" width="220" height="44" rx="6" fill="#fce4ec" stroke="#e53935" stroke-width="1.5"/>
  <text x="580" y="68" text-anchor="middle" font-size="11" fill="#b71c1c">proc₁: aws-provider</text>
  <text x="580" y="82" text-anchor="middle" font-size="9" fill="#888">creds: AKIA-SHARED</text>

  <rect x="470" y="108" width="220" height="44" rx="6" fill="#fce4ec" stroke="#e53935" stroke-width="1.5"/>
  <text x="580" y="126" text-anchor="middle" font-size="11" fill="#b71c1c">proc₂: aws-provider</text>
  <text x="580" y="140" text-anchor="middle" font-size="9" fill="#888">creds: AKIA-SHARED</text>

  <rect x="470" y="166" width="220" height="44" rx="6" fill="#fce4ec" stroke="#e53935" stroke-width="1.5"/>
  <text x="580" y="184" text-anchor="middle" font-size="11" fill="#b71c1c">proc₃: aws-provider</text>
  <text x="580" y="198" text-anchor="middle" font-size="9" fill="#888">creds: AKIA-SHARED</text>

  <rect x="470" y="224" width="220" height="44" rx="6" fill="#fce4ec" stroke="#e53935" stroke-width="1.5"/>
  <text x="580" y="242" text-anchor="middle" font-size="11" fill="#b71c1c">proc₄: aws-provider</text>
  <text x="580" y="256" text-anchor="middle" font-size="9" fill="#888">creds: AKIA-SHARED</text>

  <!-- Arrows registry → processes -->
  <line x1="390" y1="140" x2="468" y2="72" stroke="#e53935" stroke-width="1.2" marker-end="url(#arrow-b)"/>
  <line x1="390" y1="155" x2="468" y2="130" stroke="#e53935" stroke-width="1.2" marker-end="url(#arrow-b)"/>
  <line x1="390" y1="170" x2="468" y2="188" stroke="#e53935" stroke-width="1.2" marker-end="url(#arrow-b)"/>
  <line x1="390" y1="185" x2="468" y2="246" stroke="#e53935" stroke-width="1.2" marker-end="url(#arrow-b)"/>

  <!-- Warning -->
  <text x="580" y="300" text-anchor="middle" font-size="12" font-weight="600" fill="#e53935">4 identical processes — same binary, same credentials</text>
  <text x="580" y="318" text-anchor="middle" font-size="11" fill="#888">N tenants = N OS processes, unbounded</text>
</svg>
