<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#475569"/>
    </marker>
    <marker id="arrow-blue" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#3b82f6"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="360" y="28" text-anchor="middle" font-size="15" font-weight="600" fill="#1e293b">Suspend/Resume Flow Through the Bridge Layer</text>

  <!-- Runtime layer -->
  <rect x="30" y="50" width="660" height="80" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="50" y="70" font-size="11" fill="#94a3b8" font-weight="500">RUNTIME</text>

  <rect x="60" y="80" width="140" height="36" rx="6" fill="#e0f2fe" stroke="#7dd3fc"/>
  <text x="130" y="103" text-anchor="middle" font-size="12" fill="#0369a1">ReconciliationLoop</text>

  <rect x="240" y="80" width="160" height="36" rx="6" fill="#e0f2fe" stroke="#7dd3fc"/>
  <text x="320" y="103" text-anchor="middle" font-size="12" fill="#0369a1">NodeProvisionerRouter</text>

  <rect x="440" y="80" width="140" height="36" rx="6" fill="#dbeafe" stroke="#93c5fd" stroke-width="2"/>
  <text x="510" y="103" text-anchor="middle" font-size="12" font-weight="600" fill="#1d4ed8">BridgeProvisioner</text>

  <line x1="200" y1="98" x2="238" y2="98" stroke="#475569" marker-end="url(#arrow)"/>
  <line x1="400" y1="98" x2="438" y2="98" stroke="#475569" marker-end="url(#arrow)"/>

  <!-- instanceof check -->
  <rect x="440" y="155" width="140" height="28" rx="4" fill="#fef3c7" stroke="#fbbf24"/>
  <text x="510" y="174" text-anchor="middle" font-size="11" fill="#92400e">instanceof SuspendCapable?</text>

  <line x1="510" y1="116" x2="510" y2="153" stroke="#475569" marker-end="url(#arrow)"/>

  <!-- Branch: yes / no -->
  <text x="570" y="200" font-size="10" fill="#16a34a" font-weight="600">yes</text>
  <text x="448" y="200" font-size="10" fill="#dc2626" font-weight="600">no</text>

  <!-- Failed path -->
  <rect x="390" y="210" width="100" height="28" rx="4" fill="#fee2e2" stroke="#fca5a5"/>
  <text x="440" y="229" text-anchor="middle" font-size="11" fill="#991b1b">Failed</text>
  <line x1="480" y1="183" x2="465" y2="208" stroke="#dc2626" stroke-dasharray="4,3"/>

  <!-- Delegate path -->
  <line x1="545" y1="183" x2="560" y2="220" stroke="#16a34a"/>

  <!-- Bridge Provider layer -->
  <rect x="30" y="240" width="660" height="140" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <text x="50" y="260" font-size="11" fill="#94a3b8" font-weight="500">BRIDGE PROVIDER (SuspendCapable)</text>

  <!-- Terraform path -->
  <rect x="60" y="275" width="280" height="90" rx="6" fill="#ffffff" stroke="#a7f3d0"/>
  <text x="200" y="295" text-anchor="middle" font-size="12" font-weight="600" fill="#065f46">TerraformBridgeProvider</text>

  <text x="80" y="315" font-size="10" fill="#475569">1. Look up TerraformSuspendConfig</text>
  <text x="80" y="330" font-size="10" fill="#475569">2. Read current state via gRPC</text>
  <text x="80" y="345" font-size="10" fill="#475569">3. Set attribute → target value</text>
  <text x="80" y="360" font-size="10" fill="#475569">4. Plan + Apply via provider binary</text>

  <!-- Ansible path -->
  <rect x="380" y="275" width="280" height="90" rx="6" fill="#ffffff" stroke="#a7f3d0"/>
  <text x="520" y="295" text-anchor="middle" font-size="12" font-weight="600" fill="#065f46">AnsibleBridgeProvider</text>

  <text x="400" y="315" font-size="10" fill="#475569">1. Look up AnsibleModuleConfig</text>
  <text x="400" y="330" font-size="10" fill="#475569">2. Generate suspend playbook</text>
  <text x="400" y="345" font-size="10" fill="#475569">3. Set state param → target value</text>
  <text x="400" y="360" font-size="10" fill="#475569">4. Execute via ansible-playbook</text>

  <!-- Connection lines from instanceof to providers -->
  <line x1="530" y1="183" x2="200" y2="273" stroke="#3b82f6" stroke-dasharray="4,3" marker-end="url(#arrow-blue)"/>
  <line x1="550" y1="183" x2="520" y2="273" stroke="#3b82f6" stroke-dasharray="4,3" marker-end="url(#arrow-blue)"/>
</svg>
