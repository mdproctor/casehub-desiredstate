<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 500" font-family="Inter, system-ui, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 7" refX="10" refY="3.5" markerWidth="10" markerHeight="7" orient="auto-start-reverse">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="360" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e293b">Two SPIs, One Boundary</text>

  <!-- Runtime layer -->
  <rect x="40" y="50" width="640" height="120" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1" stroke-dasharray="6,4"/>
  <text x="60" y="72" font-size="12" font-weight="600" fill="#94a3b8">RECONCILIATION LOOP</text>

  <rect x="240" y="85" width="240" height="65" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="360" y="110" text-anchor="middle" font-size="14" font-weight="600" fill="#1e40af">NodeProvisioner</text>
  <text x="360" y="128" text-anchor="middle" font-size="11" fill="#3b82f6">provision() · deprovision() · readState()</text>
  <text x="360" y="142" text-anchor="middle" font-size="10" fill="#64748b">DesiredNode · ProvisionContext · ProvisionResult</text>

  <!-- SPI boundary line -->
  <line x1="40" y1="200" x2="680" y2="200" stroke="#ef4444" stroke-width="2" stroke-dasharray="8,4"/>
  <rect x="290" y="188" width="140" height="24" rx="4" fill="#fef2f2" stroke="#ef4444" stroke-width="1"/>
  <text x="360" y="205" text-anchor="middle" font-size="11" font-weight="600" fill="#dc2626">SPI BOUNDARY</text>

  <!-- Adapter layer -->
  <rect x="160" y="225" width="400" height="60" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="360" y="250" text-anchor="middle" font-size="14" font-weight="600" fill="#92400e">BridgeProvisioner</text>
  <text x="360" y="268" text-anchor="middle" font-size="11" fill="#b45309">adapts NodeProvisioner → BridgeProvider · detects capability mixins</text>

  <!-- Arrow from NodeProvisioner to BridgeProvisioner -->
  <line x1="360" y1="150" x2="360" y2="225" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Provider layer -->
  <rect x="40" y="315" width="640" height="170" rx="10" fill="#f0fdf4" stroke="#86efac" stroke-width="1" stroke-dasharray="6,4"/>
  <text x="60" y="337" font-size="12" font-weight="600" fill="#86efac">INFRASTRUCTURE ADAPTERS</text>

  <!-- BridgeProvider box -->
  <rect x="240" y="345" width="240" height="55" rx="8" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
  <text x="360" y="368" text-anchor="middle" font-size="14" font-weight="600" fill="#166534">BridgeProvider</text>
  <text x="360" y="385" text-anchor="middle" font-size="11" fill="#22c55e">apply() · destroy() · readState()</text>

  <!-- Mixins -->
  <rect x="60" y="420" width="140" height="40" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="130" y="445" text-anchor="middle" font-size="12" font-weight="500" fill="#4338ca">PlanCapable</text>

  <rect x="230" y="420" width="140" height="40" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="300" y="445" text-anchor="middle" font-size="12" font-weight="500" fill="#4338ca">ImportCapable</text>

  <rect x="400" y="420" width="160" height="40" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="480" y="445" text-anchor="middle" font-size="12" font-weight="500" fill="#4338ca">SuspendCapable</text>

  <!-- Arrow from BridgeProvisioner to BridgeProvider -->
  <line x1="360" y1="285" x2="360" y2="345" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Mixin connections -->
  <line x1="130" y1="420" x2="270" y2="400" stroke="#6366f1" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="300" y1="420" x2="340" y2="400" stroke="#6366f1" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="480" y1="420" x2="430" y2="400" stroke="#6366f1" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- Type annotations -->
  <text x="560" y="372" font-size="10" fill="#64748b">typeId · resourceId</text>
  <text x="560" y="385" font-size="10" fill="#64748b">Map&lt;String, Object&gt;</text>
</svg>
