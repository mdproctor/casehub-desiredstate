<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" font-family="Inter, system-ui, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 7" refX="10" refY="3.5" markerWidth="10" markerHeight="7" orient="auto-start-reverse">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
    <linearGradient id="bridgeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#dbeafe;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#bfdbfe;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="javaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#dcfce7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#bbf7d0;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Title -->
  <text x="360" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e293b">Mixed Graph: Bridge + Java Nodes in One Reconciliation Loop</text>

  <!-- Legend -->
  <rect x="20" y="50" width="16" height="16" rx="3" fill="url(#bridgeGrad)" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="42" y="63" font-size="12" fill="#475569">Bridge-managed (BridgeProvisioner → MockCloudProvider)</text>
  <rect x="380" y="50" width="16" height="16" rx="3" fill="url(#javaGrad)" stroke="#22c55e" stroke-width="1.5"/>
  <text x="402" y="63" font-size="12" fill="#475569">Java-provisioned (AppDeploymentProvisioner)</text>

  <!-- Network node (root) -->
  <rect x="260" y="90" width="200" height="50" rx="8" fill="url(#bridgeGrad)" stroke="#3b82f6" stroke-width="2"/>
  <text x="360" y="112" text-anchor="middle" font-size="13" font-weight="600" fill="#1e40af">network-1</text>
  <text x="360" y="128" text-anchor="middle" font-size="11" fill="#3b82f6">cloud:network</text>

  <!-- VM nodes -->
  <rect x="80" y="200" width="180" height="50" rx="8" fill="url(#bridgeGrad)" stroke="#3b82f6" stroke-width="2"/>
  <text x="170" y="222" text-anchor="middle" font-size="13" font-weight="600" fill="#1e40af">vm-web</text>
  <text x="170" y="238" text-anchor="middle" font-size="11" fill="#3b82f6">cloud:vm</text>

  <rect x="380" y="200" width="180" height="50" rx="8" fill="url(#bridgeGrad)" stroke="#3b82f6" stroke-width="2"/>
  <text x="470" y="222" text-anchor="middle" font-size="13" font-weight="600" fill="#1e40af">vm-api</text>
  <text x="470" y="238" text-anchor="middle" font-size="11" fill="#3b82f6">cloud:vm</text>

  <!-- App nodes -->
  <rect x="80" y="310" width="180" height="50" rx="8" fill="url(#javaGrad)" stroke="#22c55e" stroke-width="2"/>
  <text x="170" y="332" text-anchor="middle" font-size="13" font-weight="600" fill="#166534">app-web</text>
  <text x="170" y="348" text-anchor="middle" font-size="11" fill="#22c55e">app:deployment</text>

  <rect x="380" y="310" width="180" height="50" rx="8" fill="url(#javaGrad)" stroke="#22c55e" stroke-width="2"/>
  <text x="470" y="332" text-anchor="middle" font-size="13" font-weight="600" fill="#166534">app-api</text>
  <text x="470" y="348" text-anchor="middle" font-size="11" fill="#22c55e">app:deployment</text>

  <!-- Storage node (independent) -->
  <rect x="580" y="90" width="120" height="50" rx="8" fill="url(#bridgeGrad)" stroke="#3b82f6" stroke-width="2"/>
  <text x="640" y="112" text-anchor="middle" font-size="13" font-weight="600" fill="#1e40af">bucket-1</text>
  <text x="640" y="128" text-anchor="middle" font-size="11" fill="#3b82f6">cloud:storage</text>

  <!-- Dependency edges -->
  <line x1="310" y1="140" x2="195" y2="200" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="410" y1="140" x2="445" y2="200" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="170" y1="250" x2="170" y2="310" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="470" y1="250" x2="470" y2="310" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Annotations -->
  <text x="360" y="400" text-anchor="middle" font-size="11" fill="#94a3b8" font-style="italic">Arrows show "depends on" — additions provision roots first, removals deprovision leaves first</text>
</svg>
