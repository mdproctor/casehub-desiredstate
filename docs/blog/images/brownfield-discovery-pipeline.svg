<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" font-family="Inter, -apple-system, sans-serif" font-size="13">
  <defs>
    <marker id="arr" viewBox="0 0 10 7" refX="10" refY="3.5" markerWidth="10" markerHeight="7" orient="auto-start-auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#475569"/>
    </marker>
  </defs>

  <rect width="800" height="420" fill="#fafaf9" rx="8"/>
  <text x="400" y="30" text-anchor="middle" font-size="15" font-weight="600" fill="#1e293b">Discovery Pipeline — Component Architecture</text>

  <!-- Cloud provider layer -->
  <rect x="40" y="55" width="180" height="80" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="130" y="80" text-anchor="middle" font-size="12" font-weight="600" fill="#78350f">Cloud Provider</text>
  <text x="130" y="100" text-anchor="middle" font-size="11" fill="#92400e">DiscoveryCapable</text>
  <text x="130" y="116" text-anchor="middle" font-size="10" fill="#a16207">discover(typeId, tenancyId)</text>

  <!-- Arrow down -->
  <line x1="130" y1="135" x2="130" y2="170" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="145" y="158" font-size="10" fill="#64748b">DiscoveredResource</text>

  <!-- Bridge adapter layer -->
  <rect x="40" y="170" width="180" height="80" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text x="130" y="195" text-anchor="middle" font-size="12" font-weight="600" fill="#0c4a6e">Bridge Adapter</text>
  <text x="130" y="215" text-anchor="middle" font-size="11" fill="#075985">BridgeDiscoveryAdapter</text>
  <text x="130" y="231" text-anchor="middle" font-size="10" fill="#0369a1">state → spec filtering</text>

  <!-- Arrow down -->
  <line x1="130" y1="250" x2="130" y2="285" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="145" y="273" font-size="10" fill="#64748b">DiscoveredNode</text>

  <!-- Router layer -->
  <rect x="40" y="285" width="180" height="60" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <text x="130" y="312" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">Router</text>
  <text x="130" y="330" text-anchor="middle" font-size="10" fill="#475569">DefaultDiscoveryAdapterRouter</text>

  <!-- Arrow right from router to orchestrator -->
  <line x1="220" y1="315" x2="290" y2="315" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Orchestrator -->
  <rect x="290" y="270" width="200" height="90" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="390" y="298" text-anchor="middle" font-size="12" font-weight="600" fill="#4c1d95">DiscoveryOrchestrator</text>
  <text x="390" y="318" text-anchor="middle" font-size="11" fill="#5b21b6">discover(request)</text>
  <text x="390" y="338" text-anchor="middle" font-size="11" fill="#5b21b6">adoptBaseline(tenancyId, graph)</text>

  <!-- Arrow right from orchestrator to two outputs -->
  <line x1="490" y1="300" x2="550" y2="270" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="490" y1="330" x2="550" y2="360" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- YAML serializer -->
  <rect x="550" y="240" width="200" height="60" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="650" y="265" text-anchor="middle" font-size="12" font-weight="600" fill="#064e3b">YamlGraphSerializer</text>
  <text x="650" y="283" text-anchor="middle" font-size="10" fill="#047857">→ YAML string for operator review</text>

  <!-- Reconciliation state store -->
  <rect x="550" y="330" width="200" height="60" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="650" y="355" text-anchor="middle" font-size="12" font-weight="600" fill="#7f1d1d">ReconciliationStateStore</text>
  <text x="650" y="373" text-anchor="middle" font-size="10" fill="#991b1b">→ adoption baseline (no-op first cycle)</text>

  <!-- Labels -->
  <text x="50" y="393" font-size="10" fill="#94a3b8">bridge/api</text>
  <text x="50" y="406" font-size="10" fill="#94a3b8">+ bridge/runtime</text>
  <rect x="40" y="383" width="10" height="10" rx="2" fill="#fef3c7" stroke="#d97706"/>
  <rect x="40" y="396" width="10" height="10" rx="2" fill="#e0f2fe" stroke="#0284c7"/>

  <text x="310" y="393" font-size="10" fill="#94a3b8">runtime-core/</text>
  <rect x="300" y="383" width="10" height="10" rx="2" fill="#ede9fe" stroke="#7c3aed"/>

  <text x="560" y="406" font-size="10" fill="#94a3b8">yaml/runtime</text>
  <rect x="550" y="396" width="10" height="10" rx="2" fill="#ecfdf5" stroke="#059669"/>
</svg>
