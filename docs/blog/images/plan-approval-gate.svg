<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" font-family="'Inter','Segoe UI',system-ui,sans-serif" font-size="13">
  <defs>
    <marker id="ar" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#64748b"/>
    </marker>
    <marker id="ar-g" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#22c55e"/>
    </marker>
    <marker id="ar-r" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#ef4444"/>
    </marker>
  </defs>

  <rect width="720" height="280" fill="#fafaf9" rx="8"/>
  <text x="360" y="28" text-anchor="middle" font-size="15" font-weight="600" fill="#1e293b">Plan Approval: One Value, Three Gates</text>

  <!-- TransitionPlanner -->
  <rect x="20" y="55" width="140" height="60" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="90" y="80" text-anchor="middle" font-weight="600" fill="#92400e" font-size="12">Transition</text>
  <text x="90" y="96" text-anchor="middle" font-weight="600" fill="#92400e" font-size="12">Planner</text>

  <!-- Arrow to gate -->
  <line x1="165" y1="85" x2="210" y2="85" stroke="#64748b" stroke-width="1.5" marker-end="url(#ar)"/>

  <!-- Approval Gate (diamond) -->
  <polygon points="280,55 345,85 280,115 215,85" fill="#f1f5f9" stroke="#6366f1" stroke-width="2"/>
  <text x="280" y="82" text-anchor="middle" font-weight="600" fill="#4338ca" font-size="11">Approval</text>
  <text x="280" y="95" text-anchor="middle" font-weight="600" fill="#4338ca" font-size="11">Gate</text>

  <!-- Auto-approve path -->
  <line x1="345" y1="85" x2="420" y2="85" stroke="#22c55e" stroke-width="1.5" marker-end="url(#ar-g)"/>
  <text x="383" y="75" fill="#22c55e" font-size="10" font-weight="500">auto</text>

  <rect x="425" y="60" width="140" height="50" rx="6" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5"/>
  <text x="495" y="82" text-anchor="middle" font-weight="600" fill="#166534" font-size="12">Execute Plan</text>
  <text x="495" y="97" text-anchor="middle" fill="#15803d" font-size="10">provisioner runs</text>

  <!-- Require approval path -->
  <line x1="280" y1="115" x2="280" y2="155" stroke="#ef4444" stroke-width="1.5" marker-end="url(#ar-r)"/>
  <text x="296" y="140" fill="#ef4444" font-size="10" font-weight="500">gate</text>

  <rect x="210" y="160" width="140" height="50" rx="6" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
  <text x="280" y="182" text-anchor="middle" font-weight="600" fill="#991b1b" font-size="12">Await Approval</text>
  <text x="280" y="197" text-anchor="middle" fill="#dc2626" font-size="10">human reviews plan</text>

  <!-- Three enforcement points -->
  <rect x="20" y="230" width="210" height="40" rx="4" fill="#fef2f2" stroke="#fca5a5" stroke-width="1"/>
  <text x="125" y="248" text-anchor="middle" fill="#991b1b" font-size="11" font-weight="500">Compile: HumanGating.ALL</text>
  <text x="125" y="262" text-anchor="middle" fill="#dc2626" font-size="9">selfDetermination &lt; 0.3</text>

  <rect x="250" y="230" width="210" height="40" rx="4" fill="#ede9fe" stroke="#c4b5fd" stroke-width="1"/>
  <text x="355" y="248" text-anchor="middle" fill="#5b21b6" font-size="11" font-weight="500">Plan: RequireApproval</text>
  <text x="355" y="262" text-anchor="middle" fill="#7c3aed" font-size="9">min(selfDetermination) &lt; 0.3</text>

  <rect x="480" y="230" width="220" height="40" rx="4" fill="#f0fdf4" stroke="#86efac" stroke-width="1"/>
  <text x="590" y="248" text-anchor="middle" fill="#166534" font-size="11" font-weight="500">Runtime: Drift Exempt</text>
  <text x="590" y="262" text-anchor="middle" fill="#15803d" font-size="9">selfDetermination &gt; 0.7</text>

  <!-- Arrow from execute to arrow pointing right -->
  <line x1="565" y1="85" x2="700" y2="85" stroke="#22c55e" stroke-width="1.5" marker-end="url(#ar-g)"/>
  <text x="632" y="75" fill="#22c55e" font-size="10">reconcile</text>
</svg>
