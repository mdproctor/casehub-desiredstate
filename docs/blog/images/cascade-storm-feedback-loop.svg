<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" font-family="system-ui, -apple-system, sans-serif" font-size="13">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#334155"/>
    </marker>
    <marker id="arrow-red" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="360" y="24" text-anchor="middle" font-size="15" font-weight="600" fill="#1e293b">Cascade Storm — Reactive Feedback Loop</text>

  <!-- Main loop boxes -->
  <rect x="40" y="60" width="130" height="50" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="105" y="82" text-anchor="middle" font-weight="500" fill="#1e40af">State Change</text>
  <text x="105" y="97" text-anchor="middle" font-size="11" fill="#3b82f6">5 nodes updated</text>

  <rect x="220" y="60" width="130" height="50" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="285" y="82" text-anchor="middle" font-weight="500" fill="#92400e">RAS Detects</text>
  <text x="285" y="97" text-anchor="middle" font-size="11" fill="#b45309">situation fired</text>

  <rect x="400" y="60" width="130" height="50" rx="6" fill="#fce7f3" stroke="#ec4899" stroke-width="1.5"/>
  <text x="465" y="82" text-anchor="middle" font-weight="500" fill="#9d174d">Recompile</text>
  <text x="465" y="97" text-anchor="middle" font-size="11" fill="#be185d">graph rebuilt</text>

  <rect x="580" y="60" width="110" height="50" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/>
  <text x="635" y="82" text-anchor="middle" font-weight="500" fill="#065f46">Reconcile</text>
  <text x="635" y="97" text-anchor="middle" font-size="11" fill="#047857">apply plan</text>

  <!-- Forward arrows -->
  <line x1="170" y1="85" x2="218" y2="85" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="350" y1="85" x2="398" y2="85" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="530" y1="85" x2="578" y2="85" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Feedback loop (the cascade) -->
  <path d="M635,112 L635,150 Q635,160 625,160 L115,160 Q105,160 105,150 L105,112"
        fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#arrow-red)"/>
  <text x="370" y="176" text-anchor="middle" font-size="12" fill="#dc2626" font-weight="500">feedback → more situations → more recompilation</text>

  <!-- Stabilization window -->
  <rect x="160" y="210" width="400" height="80" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="360" y="235" text-anchor="middle" font-size="14" font-weight="600" fill="#166534">Stabilization Window</text>
  <text x="360" y="255" text-anchor="middle" font-size="12" fill="#15803d">Situations arriving during cooldown are queued</text>
  <text x="360" y="272" text-anchor="middle" font-size="12" fill="#15803d">Drained after window expires · Most produce empty diffs</text>

  <!-- Arrow from feedback to stabilization -->
  <path d="M370,178 L370,208" fill="none" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="382" y="198" font-size="11" fill="#16a34a" font-weight="500">damped</text>
</svg>
