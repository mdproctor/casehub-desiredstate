<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" font-family="Inter, -apple-system, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 7" refX="9" refY="3.5" markerWidth="8" markerHeight="6" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 7" refX="9" refY="3.5" markerWidth="8" markerHeight="6" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="800" height="320" fill="#fafafa" rx="8"/>

  <!-- BridgeProvisioner box -->
  <rect x="30" y="40" width="160" height="60" rx="6" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text x="110" y="68" text-anchor="middle" font-size="12" font-weight="600" fill="#0c4a6e">BridgeProvisioner</text>
  <text x="110" y="84" text-anchor="middle" font-size="10" fill="#64748b">provision(node, ctx)</text>

  <!-- BridgeRequest -->
  <rect x="250" y="40" width="140" height="60" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="320" y="62" text-anchor="middle" font-size="11" font-weight="600" fill="#14532d">BridgeRequest</text>
  <text x="320" y="78" text-anchor="middle" font-size="9" fill="#166534">tenancyId = "tenant-1"</text>
  <text x="320" y="90" text-anchor="middle" font-size="9" fill="#166534">typeId = "aws_instance"</text>

  <!-- Arrow: Provisioner → Request -->
  <line x1="190" y1="70" x2="247" y2="70" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="218" y="62" text-anchor="middle" font-size="9" fill="#64748b">creates</text>

  <!-- plan() box -->
  <rect x="450" y="40" width="120" height="60" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="510" y="68" text-anchor="middle" font-size="12" font-weight="600" fill="#78350f">plan()</text>
  <text x="510" y="84" text-anchor="middle" font-size="10" fill="#92400e">has full request</text>

  <!-- Arrow: Request → plan() -->
  <line x1="390" y1="70" x2="447" y2="70" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- BridgePlan (Before) -->
  <rect x="630" y="20" width="140" height="50" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="700" y="40" text-anchor="middle" font-size="10" font-weight="600" fill="#991b1b">BridgePlan (before)</text>
  <text x="700" y="54" text-anchor="middle" font-size="9" fill="#dc2626">planId = "web-1" ✗</text>

  <!-- BridgePlan (After) -->
  <rect x="630" y="80" width="140" height="60" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="700" y="98" text-anchor="middle" font-size="10" font-weight="600" fill="#14532d">BridgePlan (after)</text>
  <text x="700" y="114" text-anchor="middle" font-size="9" fill="#16a34a">tenancyId = "tenant-1" ✓</text>
  <text x="700" y="128" text-anchor="middle" font-size="9" fill="#16a34a">typeId = "aws_instance" ✓</text>

  <!-- Arrow: plan → BridgePlan before -->
  <line x1="570" y1="55" x2="627" y2="45" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrow-red)" stroke-dasharray="4,3"/>

  <!-- Arrow: plan → BridgePlan after -->
  <line x1="570" y1="80" x2="627" y2="100" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- applyPlan() box -->
  <rect x="450" y="200" width="120" height="60" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="510" y="228" text-anchor="middle" font-size="12" font-weight="600" fill="#78350f">applyPlan()</text>
  <text x="510" y="244" text-anchor="middle" font-size="10" fill="#92400e">only has plan</text>

  <!-- Arrow: BridgePlan after → applyPlan -->
  <line x1="700" y1="140" x2="700" y2="190" stroke="#64748b" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="700" y1="190" x2="700" y2="230" stroke="#64748b" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="700" y1="230" x2="573" y2="230" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Protocol routing -->
  <rect x="250" y="200" width="140" height="60" rx="6" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text x="320" y="222" text-anchor="middle" font-size="11" font-weight="600" fill="#0c4a6e">Protocol Routing</text>
  <text x="320" y="238" text-anchor="middle" font-size="9" fill="#0369a1">getProtocol(tenancyId)</text>
  <text x="320" y="250" text-anchor="middle" font-size="9" fill="#0369a1">apply(typeId, ...)</text>

  <!-- Arrow: applyPlan → Protocol -->
  <line x1="450" y1="230" x2="393" y2="230" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Caption -->
  <text x="400" y="300" text-anchor="middle" font-size="11" fill="#475569" font-style="italic">The plan is the only data bridge between plan() and applyPlan(). What it doesn't carry is lost.</text>
</svg>
