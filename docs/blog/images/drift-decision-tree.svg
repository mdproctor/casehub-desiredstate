<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#475569"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="360" y="30" text-anchor="middle" font-size="15" font-weight="600" fill="#1e293b">Drift Detection — Four Conditions, Two Outcomes</text>

  <!-- Root node -->
  <rect x="260" y="50" width="200" height="40" rx="6" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="360" y="75" text-anchor="middle" font-size="12" fill="#334155">Node drifted from spec</text>

  <!-- First decision: natural dissolution? -->
  <rect x="80" y="130" width="220" height="36" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="190" y="153" text-anchor="middle" font-size="11" fill="#92400e">All members left?</text>
  <line x1="310" y1="90" x2="190" y2="130" stroke="#475569" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- SD > 0.7 branch -->
  <rect x="20" y="200" width="140" height="36" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="90" y="223" text-anchor="middle" font-size="11" fill="#92400e">SD &gt; 0.7?</text>
  <line x1="150" y1="166" x2="90" y2="200" stroke="#475569" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="110" y="185" font-size="10" fill="#16a34a">yes</text>

  <!-- Exempt -->
  <rect x="10" y="270" width="100" height="36" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/>
  <text x="60" y="293" text-anchor="middle" font-size="11" font-weight="600" fill="#065f46">EXEMPT</text>
  <line x1="60" y1="236" x2="60" y2="270" stroke="#475569" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="45" y="256" font-size="10" fill="#16a34a">yes</text>

  <!-- Reconcile from dissolution low SD -->
  <rect x="140" y="270" width="110" height="36" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/>
  <text x="195" y="293" text-anchor="middle" font-size="11" font-weight="600" fill="#991b1b">RECONCILE</text>
  <line x1="120" y1="236" x2="195" y2="270" stroke="#475569" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="165" y="256" font-size="10" fill="#dc2626">no</text>

  <!-- Not dissolution — topology change? -->
  <rect x="380" y="130" width="240" height="36" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="500" y="153" text-anchor="middle" font-size="11" fill="#92400e">Topology changed + SD &gt; 0.7?</text>
  <line x1="410" y1="90" x2="500" y2="130" stroke="#475569" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="230" y="185" font-size="10" fill="#dc2626">no</text>

  <!-- Exempt from topology -->
  <rect x="580" y="200" width="100" height="36" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/>
  <text x="630" y="223" text-anchor="middle" font-size="11" font-weight="600" fill="#065f46">EXEMPT</text>
  <line x1="570" y1="166" x2="630" y2="200" stroke="#475569" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="610" y="185" font-size="10" fill="#16a34a">yes</text>

  <!-- Not topology — cardinality check -->
  <rect x="340" y="210" width="200" height="36" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="440" y="233" text-anchor="middle" font-size="11" fill="#92400e">Role holders &lt; minCardinality?</text>
  <line x1="460" y1="166" x2="440" y2="210" stroke="#475569" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="440" y="185" font-size="10" fill="#dc2626">no</text>

  <!-- Reconcile from cardinality -->
  <rect x="340" y="290" width="110" height="36" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/>
  <text x="395" y="313" text-anchor="middle" font-size="11" font-weight="600" fill="#991b1b">RECONCILE</text>
  <line x1="400" y1="246" x2="395" y2="290" stroke="#475569" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="382" y="272" font-size="10" fill="#16a34a">yes</text>

  <!-- Role gap check -->
  <rect x="490" y="290" width="200" height="36" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="590" y="313" text-anchor="middle" font-size="11" fill="#92400e">Obligated role unfilled?</text>
  <line x1="490" y1="246" x2="590" y2="290" stroke="#475569" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="555" y="272" font-size="10" fill="#dc2626">no</text>

  <!-- Reconcile from role gap -->
  <rect x="540" y="360" width="110" height="36" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/>
  <text x="595" y="383" text-anchor="middle" font-size="11" font-weight="600" fill="#991b1b">RECONCILE</text>
  <line x1="590" y1="326" x2="595" y2="360" stroke="#475569" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- Legend -->
  <rect x="20" y="390" width="14" height="14" rx="3" fill="#d1fae5" stroke="#10b981" stroke-width="1"/>
  <text x="40" y="402" font-size="10" fill="#334155">Autonomous change — system respects the group's decision</text>
  <rect x="20" y="412" width="14" height="14" rx="3" fill="#fee2e2" stroke="#ef4444" stroke-width="1"/>
  <text x="40" y="424" font-size="10" fill="#334155">Structural gap — system intervenes to restore the spec</text>
  <text x="20" y="448" font-size="10" fill="#64748b">SD = selfDetermination (autonomy score 0.0–1.0)</text>
</svg>