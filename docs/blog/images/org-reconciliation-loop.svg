<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" font-family="'Inter','Segoe UI',system-ui,sans-serif" font-size="13">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#64748b"/>
    </marker>
    <marker id="arrow-blue" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#3b82f6"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="800" height="420" fill="#fafaf9" rx="8"/>

  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" font-size="16" font-weight="600" fill="#1e293b">Org Reconciliation Loop</text>

  <!-- Desired State (left) -->
  <rect x="30" y="60" width="200" height="140" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="130" y="82" text-anchor="middle" font-weight="600" fill="#1e40af">Desired State</text>
  <text x="130" y="105" text-anchor="middle" fill="#475569" font-size="11">OrganizationalUnit</text>
  <text x="130" y="122" text-anchor="middle" fill="#475569" font-size="11">topology: swarm</text>
  <text x="130" y="139" text-anchor="middle" fill="#475569" font-size="11">members: [a1, a2, a3]</text>
  <text x="130" y="156" text-anchor="middle" fill="#475569" font-size="11">selfDetermination: 0.5</text>
  <text x="130" y="180" text-anchor="middle" fill="#64748b" font-size="10" font-style="italic">OrgGoalCompiler</text>

  <!-- Actual State (right) -->
  <rect x="570" y="60" width="200" height="140" rx="6" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5"/>
  <text x="670" y="82" text-anchor="middle" font-weight="600" fill="#166534">Actual State</text>
  <text x="670" y="105" text-anchor="middle" fill="#475569" font-size="11">GroupInstance</text>
  <text x="670" y="122" text-anchor="middle" fill="#475569" font-size="11">state: ACTIVE</text>
  <text x="670" y="139" text-anchor="middle" fill="#475569" font-size="11">members: [a1, a2]</text>
  <text x="670" y="156" text-anchor="middle" fill="#475569" font-size="11">topology: mesh</text>
  <text x="670" y="180" text-anchor="middle" fill="#64748b" font-size="10" font-style="italic">DesiredStateOrgAdapter</text>

  <!-- Diff arrow -->
  <line x1="235" y1="130" x2="330" y2="130" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="565" y1="130" x2="470" y2="130" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- TransitionPlanner (center) -->
  <rect x="335" y="90" width="130" height="80" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="400" y="120" text-anchor="middle" font-weight="600" fill="#92400e" font-size="12">Transition</text>
  <text x="400" y="138" text-anchor="middle" font-weight="600" fill="#92400e" font-size="12">Planner</text>
  <text x="400" y="158" text-anchor="middle" fill="#78716c" font-size="10">diff + plan</text>

  <!-- Provisioner (center bottom) -->
  <line x1="400" y1="175" x2="400" y2="230" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <rect x="300" y="235" width="200" height="65" rx="6" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="400" y="260" text-anchor="middle" font-weight="600" fill="#5b21b6">OrgNodeProvisioner</text>
  <text x="400" y="280" text-anchor="middle" fill="#7c3aed" font-size="11">provision / deprovision</text>

  <!-- Policy boxes -->
  <rect x="30" y="240" width="140" height="55" rx="6" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
  <text x="100" y="263" text-anchor="middle" font-weight="600" fill="#991b1b" font-size="11">OrgFaultPolicy</text>
  <text x="100" y="280" text-anchor="middle" fill="#dc2626" font-size="10">3x retry, 5x escalate</text>

  <rect x="30" y="310" width="140" height="55" rx="6" fill="#fff7ed" stroke="#f97316" stroke-width="1.5"/>
  <text x="100" y="333" text-anchor="middle" font-weight="600" fill="#9a3412" font-size="11">OrgDriftPolicy</text>
  <text x="100" y="350" text-anchor="middle" fill="#ea580c" font-size="10">exempt if autonomous</text>

  <!-- Emergence (bottom right) -->
  <rect x="570" y="310" width="200" height="55" rx="6" fill="#fdf4ff" stroke="#d946ef" stroke-width="1.5"/>
  <text x="670" y="333" text-anchor="middle" font-weight="600" fill="#86198f" font-size="11">Emergence Listener</text>
  <text x="670" y="350" text-anchor="middle" fill="#a21caf" font-size="10">swarm team -> org group</text>

  <!-- Lifecycle Service (bottom center) -->
  <rect x="300" y="330" width="200" height="55" rx="6" fill="#f0f9ff" stroke="#0ea5e9" stroke-width="1.5"/>
  <text x="400" y="350" text-anchor="middle" font-weight="600" fill="#0c4a6e" font-size="11">GroupLifecycleService</text>
  <text x="400" y="367" text-anchor="middle" fill="#0369a1" font-size="10">create / dissolve / join / leave</text>

  <!-- Connection lines -->
  <line x1="400" y1="300" x2="400" y2="325" stroke="#64748b" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="175" y1="268" x2="295" y2="268" stroke="#64748b" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="175" y1="338" x2="295" y2="338" stroke="#64748b" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="565" y1="338" x2="505" y2="358" stroke="#64748b" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- Loop arrow at bottom -->
  <path d="M 500 358 Q 550 400 400 400 Q 250 400 130 380 Q 60 370 60 300 Q 60 230 60 200 L 60 200" stroke="#3b82f6" stroke-width="1.5" fill="none" stroke-dasharray="6,3" marker-end="url(#arrow-blue)"/>
  <text x="400" y="415" text-anchor="middle" fill="#3b82f6" font-size="10" font-style="italic">reconciliation cycle</text>
</svg>
