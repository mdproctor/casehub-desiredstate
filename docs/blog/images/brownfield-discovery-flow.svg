<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" font-family="Inter, -apple-system, sans-serif" font-size="13">
  <defs>
    <marker id="arrow" viewBox="0 0 10 7" refX="10" refY="3.5" markerWidth="10" markerHeight="7" orient="auto-start-auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#475569"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="800" height="340" fill="#fafaf9" rx="8"/>

  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" font-size="15" font-weight="600" fill="#1e293b">Normal vs Discovery Flow</text>

  <!-- Normal flow -->
  <text x="60" y="70" font-size="12" font-weight="600" fill="#64748b">GREENFIELD (normal)</text>

  <rect x="60" y="85" width="120" height="40" rx="6" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text x="120" y="109" text-anchor="middle" font-size="12" fill="#0c4a6e">Write YAML</text>

  <line x1="180" y1="105" x2="220" y2="105" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="220" y="85" width="120" height="40" rx="6" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text x="280" y="109" text-anchor="middle" font-size="12" fill="#0c4a6e">GoalCompiler</text>

  <line x1="340" y1="105" x2="380" y2="105" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="380" y="85" width="140" height="40" rx="6" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text x="450" y="109" text-anchor="middle" font-size="12" fill="#0c4a6e">DesiredStateGraph</text>

  <line x1="520" y1="105" x2="560" y2="105" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="560" y="85" width="120" height="40" rx="6" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text x="620" y="109" text-anchor="middle" font-size="12" fill="#0c4a6e">Reconcile</text>

  <!-- Divider -->
  <line x1="40" y1="155" x2="760" y2="155" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="6 4"/>

  <!-- Discovery flow -->
  <text x="60" y="190" font-size="12" font-weight="600" fill="#64748b">BROWNFIELD (discovery)</text>

  <rect x="60" y="205" width="120" height="40" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="120" y="229" text-anchor="middle" font-size="12" fill="#78350f">Enumerate</text>

  <line x1="180" y1="225" x2="220" y2="225" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="220" y="205" width="120" height="40" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="280" y="229" text-anchor="middle" font-size="12" fill="#78350f">Build graph</text>

  <line x1="340" y1="225" x2="380" y2="225" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="380" y="205" width="120" height="40" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="440" y="229" text-anchor="middle" font-size="12" fill="#78350f">Generate YAML</text>

  <line x1="500" y1="225" x2="540" y2="225" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="540" y="205" width="100" height="40" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="590" y="229" text-anchor="middle" font-size="12" fill="#064e3b">Review</text>

  <line x1="640" y1="225" x2="680" y2="225" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="680" y="205" width="80" height="40" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="720" y="229" text-anchor="middle" font-size="12" fill="#064e3b">Adopt</text>

  <!-- Convergence annotation -->
  <line x1="620" y1="125" x2="620" y2="260" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="630" y="295" font-size="11" fill="#94a3b8" font-style="italic">same reconciliation</text>
  <text x="630" y="310" font-size="11" fill="#94a3b8" font-style="italic">loop from here</text>
</svg>
