<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="Inter, -apple-system, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 7" refX="9" refY="3.5" markerWidth="8" markerHeight="6" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="800" height="400" fill="#fafafa" rx="8"/>

  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">Six Bugs at the Seams</text>

  <!-- Left column: Desired-State Runtime -->
  <rect x="30" y="55" width="230" height="310" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1"/>
  <text x="145" y="78" text-anchor="middle" font-size="12" font-weight="600" fill="#1e40af">Desired-State Runtime</text>

  <!-- Right column: External Tools -->
  <rect x="540" y="55" width="230" height="310" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
  <text x="655" y="78" text-anchor="middle" font-size="12" font-weight="600" fill="#92400e">External Tools</text>

  <!-- Center: Bridge Adapter Layer -->
  <rect x="280" y="55" width="240" height="310" rx="8" fill="#fff" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="400" y="78" text-anchor="middle" font-size="12" font-weight="700" fill="#374151">Bridge Adapter Layer</text>

  <!-- Bug 1: planId routing -->
  <rect x="295" y="95" width="210" height="36" rx="4" fill="#fef2f2" stroke="#fca5a5" stroke-width="1"/>
  <text x="400" y="110" text-anchor="middle" font-size="9" font-weight="600" fill="#991b1b">#200 planId carried resourceId, not tenancyId</text>
  <text x="400" y="122" text-anchor="middle" font-size="8" fill="#b91c1c">→ wrong tenant routing in applyPlan()</text>

  <!-- Bug 2: CREATE vs no-op -->
  <rect x="295" y="140" width="210" height="36" rx="4" fill="#fef2f2" stroke="#fca5a5" stroke-width="1"/>
  <text x="400" y="155" text-anchor="middle" font-size="9" font-weight="600" fill="#991b1b">#201 plan() returned CREATE for no-change</text>
  <text x="400" y="167" text-anchor="middle" font-size="8" fill="#b91c1c">→ unnecessary provisioning on converged state</text>

  <!-- Bug 3: directory URL -->
  <rect x="295" y="185" width="210" height="36" rx="4" fill="#fef2f2" stroke="#fca5a5" stroke-width="1"/>
  <text x="400" y="200" text-anchor="middle" font-size="9" font-weight="600" fill="#991b1b">#202 directory URL opened as YAML stream</text>
  <text x="400" y="212" text-anchor="middle" font-size="8" fill="#b91c1c">→ zero bridge beans in Spring apps</text>

  <!-- Bug 4: deployment extension -->
  <rect x="295" y="230" width="210" height="36" rx="4" fill="#fff7ed" stroke="#fdba74" stroke-width="1"/>
  <text x="400" y="245" text-anchor="middle" font-size="9" font-weight="600" fill="#9a3412">#203 deployment extension only registered native</text>
  <text x="400" y="257" text-anchor="middle" font-size="8" fill="#c2410c">→ zero bridge beans in Quarkus apps</text>

  <!-- Bug 5: warnings as drift -->
  <rect x="295" y="275" width="210" height="36" rx="4" fill="#fef2f2" stroke="#fca5a5" stroke-width="1"/>
  <text x="400" y="290" text-anchor="middle" font-size="9" font-weight="600" fill="#991b1b">#204 warning diagnostics triggered drift</text>
  <text x="400" y="302" text-anchor="middle" font-size="8" fill="#b91c1c">→ false drift on every deprecation warning</text>

  <!-- Bug 6: no PERMANENT -->
  <rect x="295" y="320" width="210" height="36" rx="4" fill="#fef2f2" stroke="#fca5a5" stroke-width="1"/>
  <text x="400" y="335" text-anchor="middle" font-size="9" font-weight="600" fill="#991b1b">#205 error classifier never returned PERMANENT</text>
  <text x="400" y="347" text-anchor="middle" font-size="8" fill="#b91c1c">→ infinite retry loops for permanent failures</text>

  <!-- Connecting lines -->
  <line x1="260" y1="200" x2="293" y2="200" stroke="#64748b" stroke-width="1" marker-end="url(#arr)" stroke-dasharray="3,2"/>
  <line x1="507" y1="200" x2="538" y2="200" stroke="#64748b" stroke-width="1" marker-end="url(#arr)" stroke-dasharray="3,2"/>

  <!-- Labels on sides -->
  <text x="145" y="200" text-anchor="middle" font-size="10" fill="#3b82f6">Reconciliation</text>
  <text x="145" y="214" text-anchor="middle" font-size="10" fill="#3b82f6">TransitionPlanner</text>
  <text x="145" y="228" text-anchor="middle" font-size="10" fill="#3b82f6">FaultPolicy</text>

  <text x="655" y="200" text-anchor="middle" font-size="10" fill="#92400e">Terraform gRPC</text>
  <text x="655" y="214" text-anchor="middle" font-size="10" fill="#92400e">Ansible CLI</text>
  <text x="655" y="228" text-anchor="middle" font-size="10" fill="#92400e">Spring / Quarkus</text>
</svg>
