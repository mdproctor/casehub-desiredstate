<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" font-family="'Inter','Segoe UI',system-ui,sans-serif" font-size="13">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#64748b"/>
    </marker>
    <marker id="arrow-red" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#ef4444"/>
    </marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#22c55e"/>
    </marker>
  </defs>

  <rect width="800" height="380" fill="#fafaf9" rx="8"/>

  <!-- Title -->
  <text x="400" y="28" text-anchor="middle" font-size="15" font-weight="600" fill="#1e293b">Before: Dual Mutation Path</text>

  <!-- External API box -->
  <rect x="30" y="50" width="150" height="50" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="105" y="72" text-anchor="middle" font-weight="500" fill="#1e40af">External API</text>
  <text x="105" y="87" text-anchor="middle" fill="#475569" font-size="10">createGroup / joinGroup</text>

  <!-- Lifecycle Service -->
  <rect x="260" y="50" width="200" height="50" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="360" y="72" text-anchor="middle" font-weight="500" fill="#1e40af">GroupLifecycleService</text>
  <text x="360" y="87" text-anchor="middle" fill="#475569" font-size="10">OrgGoal → compile → CAS</text>

  <!-- Arrow: API → Service -->
  <line x1="180" y1="75" x2="255" y2="75" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Reconciliation Loop -->
  <rect x="260" y="130" width="200" height="40" rx="6" fill="#fefce8" stroke="#eab308" stroke-width="1.5"/>
  <text x="360" y="155" text-anchor="middle" font-weight="500" fill="#854d0e">ReconciliationLoop</text>

  <!-- Arrow: Service → Loop -->
  <line x1="360" y1="100" x2="360" y2="126" stroke="#64748b" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- Provisioner -->
  <rect x="260" y="200" width="200" height="50" rx="6" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
  <text x="360" y="222" text-anchor="middle" font-weight="500" fill="#991b1b">OrgNodeProvisioner</text>
  <text x="360" y="237" text-anchor="middle" fill="#475569" font-size="10">direct registry/store writes</text>

  <!-- Arrow: Loop → Provisioner -->
  <line x1="360" y1="170" x2="360" y2="196" stroke="#64748b" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- Three stores -->
  <rect x="550" y="185" width="100" height="30" rx="4" fill="#fff" stroke="#ef4444" stroke-width="1"/>
  <text x="600" y="205" text-anchor="middle" fill="#991b1b" font-size="11">OrgRegistry</text>

  <rect x="550" y="225" width="100" height="30" rx="4" fill="#fff" stroke="#ef4444" stroke-width="1"/>
  <text x="600" y="245" text-anchor="middle" fill="#991b1b" font-size="11">InstanceStore</text>

  <rect x="550" y="265" width="100" height="30" rx="4" fill="#fff" stroke="#ef4444" stroke-width="1"/>
  <text x="600" y="285" text-anchor="middle" fill="#991b1b" font-size="11">ChannelCreator</text>

  <!-- Arrows: Provisioner → Stores -->
  <line x1="460" y1="215" x2="546" y2="200" stroke="#ef4444" stroke-width="1.5" marker-end="url(#arrow-red)"/>
  <line x1="460" y1="225" x2="546" y2="240" stroke="#ef4444" stroke-width="1.5" marker-end="url(#arrow-red)"/>
  <line x1="460" y1="235" x2="546" y2="280" stroke="#ef4444" stroke-width="1.5" marker-end="url(#arrow-red)"/>

  <!-- Problem label -->
  <text x="690" y="240" fill="#991b1b" font-size="11" font-weight="600">✗ bypasses</text>
  <text x="690" y="255" fill="#991b1b" font-size="11" font-weight="600">  lifecycle service</text>

  <!-- AFTER section -->
  <line x1="0" y1="310" x2="800" y2="310" stroke="#e2e8f0" stroke-width="1"/>
  <text x="400" y="335" text-anchor="middle" font-size="15" font-weight="600" fill="#1e293b">After: Single Entry Point</text>

  <rect x="260" y="348" width="200" height="30" rx="6" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5"/>
  <text x="360" y="368" text-anchor="middle" font-weight="500" fill="#166534">Provisioner → materialize()</text>

  <!-- Arrow back to service -->
  <line x1="460" y1="363" x2="546" y2="363" stroke="#22c55e" stroke-width="1.5" marker-end="url(#arrow-green)"/>

  <text x="600" y="356" text-anchor="middle" fill="#166534" font-size="11" font-weight="600">delegates to</text>
  <text x="600" y="371" text-anchor="middle" fill="#166534" font-size="11" font-weight="600">lifecycle service</text>
</svg>
