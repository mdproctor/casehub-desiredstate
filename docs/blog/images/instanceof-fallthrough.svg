<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" font-family="Inter, -apple-system, sans-serif" font-size="13">
  <defs>
    <marker id="arr" viewBox="0 0 10 7" refX="10" refY="3.5" markerWidth="10" markerHeight="7" orient="auto-start-auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#475569"/>
    </marker>
  </defs>

  <rect width="720" height="380" fill="#fafaf9" rx="8"/>
  <text x="360" y="28" text-anchor="middle" font-size="14" font-weight="600" fill="#1e293b">The instanceof Fallthrough</text>

  <!-- Left side: BridgeNodeSpec path (normal) -->
  <text x="120" y="60" text-anchor="middle" font-size="12" font-weight="600" fill="#059669">Normal path (YAML-declared)</text>

  <rect x="40" y="75" width="160" height="36" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="120" y="97" text-anchor="middle" font-size="11" fill="#064e3b">BridgeNodeSpec</text>

  <line x1="120" y1="111" x2="120" y2="138" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="20" y="140" width="200" height="36" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="120" y="162" text-anchor="middle" font-size="11" fill="#064e3b">instanceof BridgeNodeSpec ✓</text>

  <line x1="120" y1="176" x2="120" y2="203" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="20" y="205" width="200" height="36" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="120" y="221" text-anchor="middle" font-size="10" fill="#064e3b">desiredSpec = bns.fields()</text>
  <text x="120" y="234" text-anchor="middle" font-size="10" fill="#064e3b">{name: "web-1", type: "t3.medium"}</text>

  <line x1="120" y1="241" x2="120" y2="268" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="40" y="270" width="160" height="36" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="120" y="292" text-anchor="middle" font-size="11" fill="#064e3b">status = PRESENT</text>

  <!-- Right side: MapNodeSpec path (discovery — before fix) -->
  <text x="520" y="60" text-anchor="middle" font-size="12" font-weight="600" fill="#dc2626">Discovery path (before fix)</text>

  <rect x="440" y="75" width="160" height="36" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="520" y="97" text-anchor="middle" font-size="11" fill="#7f1d1d">MapNodeSpec</text>

  <line x1="520" y1="111" x2="520" y2="138" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="420" y="140" width="200" height="36" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="520" y="162" text-anchor="middle" font-size="11" fill="#7f1d1d">instanceof BridgeNodeSpec ✗</text>

  <line x1="520" y1="176" x2="520" y2="203" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="420" y="205" width="200" height="36" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="520" y="221" text-anchor="middle" font-size="10" fill="#7f1d1d">desiredSpec = Map.of()</text>
  <text x="520" y="234" text-anchor="middle" font-size="10" fill="#7f1d1d">{ } ← empty!</text>

  <line x1="520" y1="241" x2="520" y2="268" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="440" y="270" width="160" height="36" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="520" y="292" text-anchor="middle" font-size="11" fill="#7f1d1d">status = DRIFTED</text>

  <!-- Divider -->
  <line x1="320" y1="55" x2="320" y2="320" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- Bottom annotation -->
  <rect x="350" y="330" width="340" height="40" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
  <text x="520" y="349" text-anchor="middle" font-size="11" fill="#78350f">Planner sees DRIFTED → plans PROVISION</text>
  <text x="520" y="363" text-anchor="middle" font-size="11" fill="#78350f">→ re-provisions the entire environment</text>

  <rect x="30" y="330" width="240" height="40" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1"/>
  <text x="150" y="349" text-anchor="middle" font-size="11" fill="#064e3b">Planner sees PRESENT → no action</text>
  <text x="150" y="363" text-anchor="middle" font-size="11" fill="#064e3b">→ zero-transition adoption ✓</text>
</svg>
