<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 220" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#475569"/>
    </marker>
    <marker id="arr-red" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="350" y="24" text-anchor="middle" font-size="14" font-weight="600" fill="#1e293b">Graceful Dissolution — Drain Before Destroy</text>

  <!-- ACTIVE -->
  <rect x="20" y="70" width="100" height="44" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="70" y="88" text-anchor="middle" font-size="12" font-weight="600" fill="#1e40af">ACTIVE</text>
  <text x="70" y="104" text-anchor="middle" font-size="9" fill="#3b82f6">members present</text>

  <!-- dissolveGroup() arrow -->
  <line x1="120" y1="92" x2="180" y2="92" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="150" y="84" text-anchor="middle" font-size="9" fill="#64748b">dissolveGroup()</text>

  <!-- DISSOLVING -->
  <rect x="182" y="70" width="120" height="44" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="242" y="88" text-anchor="middle" font-size="12" font-weight="600" fill="#92400e">DISSOLVING</text>
  <text x="242" y="104" text-anchor="middle" font-size="9" fill="#d97706">draining…</text>

  <!-- deprovision arrow -->
  <line x1="302" y1="92" x2="365" y2="92" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="334" y="84" text-anchor="middle" font-size="9" fill="#64748b">deprovision</text>

  <!-- Decision diamond -->
  <polygon points="405,70 440,92 405,114 370,92" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="405" y="95" text-anchor="middle" font-size="9" fill="#334155">empty?</text>

  <!-- Yes → DISSOLVED -->
  <line x1="440" y1="92" x2="500" y2="92" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="470" y="84" text-anchor="middle" font-size="9" fill="#16a34a">yes</text>

  <rect x="502" y="70" width="110" height="44" rx="8" fill="#d1fae5" stroke="#10b981" stroke-width="2"/>
  <text x="557" y="88" text-anchor="middle" font-size="12" font-weight="600" fill="#065f46">DISSOLVED</text>
  <text x="557" y="104" text-anchor="middle" font-size="9" fill="#10b981">cleanup done</text>

  <!-- No → Failed -->
  <line x1="405" y1="114" x2="405" y2="150" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arr-red)"/>
  <text x="420" y="136" font-size="9" fill="#dc2626">no</text>

  <rect x="340" y="152" width="130" height="44" rx="8" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/>
  <text x="405" y="170" text-anchor="middle" font-size="11" font-weight="600" fill="#991b1b">Failed</text>
  <text x="405" y="186" text-anchor="middle" font-size="9" fill="#dc2626">N members remaining</text>

  <!-- Retry loop -->
  <path d="M340,174 L280,174 Q260,174 260,154 L260,115 Q260,92 282,92" fill="none" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arr)"/>
  <text x="240" y="148" text-anchor="middle" font-size="8" fill="#64748b">next cycle</text>

  <!-- Fault escalation -->
  <line x1="470" y1="174" x2="530" y2="174" stroke="#dc2626" stroke-width="1.2" marker-end="url(#arr-red)"/>
  <rect x="532" y="152" width="140" height="44" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="602" y="170" text-anchor="middle" font-size="10" font-weight="600" fill="#991b1b">Fault Escalation</text>
  <text x="602" y="186" text-anchor="middle" font-size="9" fill="#dc2626">retry → review → human</text>
  <text x="500" y="166" font-size="8" fill="#dc2626">repeated</text>
</svg>