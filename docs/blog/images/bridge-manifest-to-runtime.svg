<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 260" font-family="Inter, -apple-system, sans-serif">
  <defs>
    <marker id="a1" viewBox="0 0 10 7" refX="9" refY="3.5" markerWidth="8" markerHeight="6" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="780" height="260" fill="#fafafa" rx="8"/>

  <!-- Step 1: YAML manifest -->
  <rect x="20" y="50" width="150" height="100" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="95" y="76" text-anchor="middle" font-size="12" font-weight="600" fill="#78350f">bridge.yaml</text>
  <text x="95" y="96" text-anchor="middle" font-size="9" fill="#92400e">protocol: terraform</text>
  <text x="95" y="110" text-anchor="middle" font-size="9" fill="#92400e">credentialRef: aws</text>
  <text x="95" y="124" text-anchor="middle" font-size="9" fill="#92400e">types: [...]</text>
  <text x="95" y="140" text-anchor="middle" font-size="8" fill="#b45309">META-INF/desiredstate/bridges/</text>

  <!-- Arrow 1 -->
  <line x1="170" y1="100" x2="210" y2="100" stroke="#64748b" stroke-width="1.5" marker-end="url(#a1)"/>

  <!-- Step 2: Parser -->
  <rect x="213" y="60" width="120" height="80" rx="6" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text x="273" y="88" text-anchor="middle" font-size="11" font-weight="600" fill="#0c4a6e">Manifest</text>
  <text x="273" y="104" text-anchor="middle" font-size="11" font-weight="600" fill="#0c4a6e">Parser</text>
  <text x="273" y="122" text-anchor="middle" font-size="9" fill="#64748b">→ BridgeDescriptor</text>

  <!-- Arrow 2 -->
  <line x1="333" y1="100" x2="373" y2="100" stroke="#64748b" stroke-width="1.5" marker-end="url(#a1)"/>

  <!-- Step 3: Discovery -->
  <rect x="376" y="60" width="120" height="80" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="436" y="88" text-anchor="middle" font-size="11" font-weight="600" fill="#14532d">Bridge</text>
  <text x="436" y="104" text-anchor="middle" font-size="11" font-weight="600" fill="#14532d">Discovery</text>
  <text x="436" y="122" text-anchor="middle" font-size="9" fill="#64748b">→ BeanRegistration</text>

  <!-- Arrow 3 -->
  <line x1="496" y1="100" x2="536" y2="100" stroke="#64748b" stroke-width="1.5" marker-end="url(#a1)"/>

  <!-- Step 4: Runtime beans -->
  <rect x="539" y="50" width="220" height="100" rx="6" fill="#faf5ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="649" y="78" text-anchor="middle" font-size="12" font-weight="600" fill="#5b21b6">Runtime Beans</text>
  <text x="649" y="100" text-anchor="middle" font-size="10" fill="#7c3aed">BridgeProvisioner</text>
  <text x="649" y="116" text-anchor="middle" font-size="10" fill="#7c3aed">BridgeActualStateAdapter</text>
  <text x="649" y="132" text-anchor="middle" font-size="10" fill="#7c3aed">NodeProvisioner</text>
  <text x="649" y="140" text-anchor="middle" font-size="7" fill="#a78bfa">(registered in CDI / Spring context)</text>

  <!-- Labels -->
  <text x="95" y="178" text-anchor="middle" font-size="10" font-weight="500" fill="#64748b">1. Declare</text>
  <text x="273" y="168" text-anchor="middle" font-size="10" font-weight="500" fill="#64748b">2. Parse</text>
  <text x="436" y="168" text-anchor="middle" font-size="10" font-weight="500" fill="#64748b">3. Discover</text>
  <text x="649" y="178" text-anchor="middle" font-size="10" font-weight="500" fill="#64748b">4. Wire</text>

  <!-- Caption -->
  <text x="390" y="220" text-anchor="middle" font-size="11" fill="#475569" font-style="italic">A YAML manifest becomes runtime beans — no Java provisioner code needed.</text>
  <text x="390" y="238" text-anchor="middle" font-size="10" fill="#94a3b8">Works identically on Quarkus (build-time) and Spring (startup-time).</text>
</svg>
